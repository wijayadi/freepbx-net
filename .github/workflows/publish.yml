name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Sengsara.Freepbx.sln

    - name: Build
      run: dotnet build Sengsara.Freepbx.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test Sengsara.Freepbx.sln --configuration Release --no-build --verbosity normal

    - name: Pack Abstractions
      run: dotnet pack src/Sengsara.Freepbx.Abstractions/Sengsara.Freepbx.Abstractions.csproj --configuration Release --no-build -p:PackageVersion=${{ github.ref_name }} -o ./artifacts

    - name: Pack Main Library
      run: dotnet pack src/Sengsara.Freepbx/Sengsara.Freepbx.csproj --configuration Release --no-build -p:PackageVersion=${{ github.ref_name }} -o ./artifacts

    - name: Pack SourceGen
      run: dotnet pack src/Sengsara.Freepbx.SourceGen/Sengsara.Freepbx.SourceGen.csproj --configuration Release --no-build -p:PackageVersion=${{ github.ref_name }} -o ./artifacts

    - name: Publish to NuGet
      if: github.event_name == 'release'
      run: |
        for nupkg in ./artifacts/*.nupkg; do
          dotnet nuget push "$nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
        done
      continue-on-error: true

    - name: Publish to GitHub Packages
      run: |
        for nupkg in ./artifacts/*.nupkg; do
          dotnet nuget push "$nupkg" --source https://nuget.pkg.github.com/${{ github.repository_owner }} --api-key ${{ secrets.GITHUB_TOKEN }}
        done
      continue-on-error: true